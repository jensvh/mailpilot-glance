# XcodeGen recipe for MailPilot Glance. There is no Mac in this project: GitHub
# Actions generates the Xcode project from this file and builds an unsigned
# .ipa (.github/workflows/ios.yml).
name: MailPilotGlance
options:
  deploymentTarget:
    iOS: "17.2"
packages:
  # Meta Wearables Device Access Toolkit: the glasses' session and display.
  # The same version MailPilot Lens was tried with on the glasses.
  MWDAT:
    url: https://github.com/meta/meta-wearables-dat-ios
    exactVersion: 1.0.1
settings:
  base:
    # Swift 5 language mode: written without a local compiler, so Swift 6's
    # strict concurrency checks would only add build round trips.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    # The icon is drawn by the build (tools/icon), the accent colour is the app's violet.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  MailPilotGlance:
    type: application
    platform: iOS
    sources:
      # Everything but the demo: its made-up data and its own app entry.
      - path: Sources
        excludes:
          - "Demo/**"
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATDisplay
    scheme: {}
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Glance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # On duty keeps the microphone, the relay connection and the glasses
        # link alive while the phone is locked in a pocket.
        UIBackgroundModes:
          - audio
          - bluetooth-central
          - bluetooth-peripheral
          - external-accessory
          - processing
        # The toolkit's Bluetooth Classic link to the glasses.
        UISupportedExternalAccessoryProtocols:
          - com.meta.ar.wearable
        NSMicrophoneUsageDescription: Glance listens through your glasses for your answer to an agent's question.
        NSBluetoothAlwaysUsageDescription: Needed to connect to your Meta glasses.
        NSBluetoothPeripheralUsageDescription: Needed to connect to your Meta glasses.
        ITSAppUsesNonExemptEncryption: false
        # The log shows up in the Files app under "On My iPhone".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # mailpilotglance://pair?… is the pairing code MailPilot shows; the Meta AI
        # app also returns to this app through this scheme.
        CFBundleURLTypes:
          - CFBundleURLName: mailpilotglance
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - mailpilotglance
        # Device Access Toolkit. In Developer Mode no Meta app ID is needed.
        MWDAT:
          AppLinkURLScheme: mailpilotglance://
          Analytics:
            OptOut: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jensvh.mailpilot.glance
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # The app is signed later, on Windows, with your Apple ID.
        CODE_SIGNING_ALLOWED: NO
  # The same screens on made-up data, without the glasses' toolkit: the build opens it in the
  # simulator on one screen at a time and takes a picture (the "screens" job). It is how the
  # app's look is checked without a Mac or a phone, and it only compiles while the screens need
  # nothing but plain values.
  GlanceDemo:
    type: application
    platform: iOS
    sources:
      - Sources/UI
      - Sources/Board
      - Sources/Demo
      - Sources/Support
      - Sources/Link/Protocol.swift
      # The protocol names the envelope (a key's length); it needs CryptoKit only.
      - Sources/Link/Envelope.swift
      - Sources/Assets.xcassets
    scheme: {}
    info:
      path: Demo-Info.plist
      properties:
        CFBundleDisplayName: Glance Demo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jensvh.mailpilot.glance.demo
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
